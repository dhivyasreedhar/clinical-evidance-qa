services:
  database:
    image: postgres:16.14
    environment:
      POSTGRES_USER: ehr_owner
      POSTGRES_PASSWORD: local-owner
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr_owner -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database:
