[project]
name = "clinical-evidence"
version = "0.1.0"
description = "Source-grounded clinical evidence workspace"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.22,<1",
  "itsdangerous>=2.2,<3",
  "anthropic>=0.84,<2",
]

[project.optional-dependencies]
benchmark = [
    "fastembed>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["services", ".", "tests"]
testpaths = ["tests", "record_engine/tests"]
addopts = "-ra"
markers = ["integration: requires the isolated local PostgreSQL test database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
mypy_path = "services:."
packages = ["clinical", "record_engine"]
exclude = ["^record_engine/tests/"]
strict = true
