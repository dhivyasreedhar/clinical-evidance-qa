<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#255e4b"/></marker></defs><rect width="100%" height="100%" fill="#f6f8f5"/><rect x="20" y="20" width="1360" height="190" rx="14" fill="none" stroke="#c9d6cd" stroke-dasharray="6 5"/><text x="36" y="42" font-size="14" font-weight="700" fill="#74827b">[1] INGEST — no model calls · import worker (leased job, per-patient advisory lock)</text><rect x="40" y="50" width="230" height="140" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="52" y="74" font-size="15" font-weight="700" fill="#233730">Upload TXT files</text><text x="52" y="96" font-size="13" fill="#33463f">web app or API</text><text x="52" y="114" font-size="13" fill="#33463f">multipart · Idempotency-Key</text><text x="52" y="132" font-size="13" fill="#33463f">CSRF · dev session</text><rect x="300" y="50" width="300" height="140" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="312" y="74" font-size="15" font-weight="700" fill="#233730">Source revisions</text><text x="312" y="96" font-size="13" fill="#33463f">object store: SHA-256, bytes never edited</text><text x="312" y="114" font-size="13" fill="#33463f">blocks with exact char + line offsets</text><text x="312" y="132" font-size="13" fill="#33463f">(SourceSpan = citable unit)</text><text x="312" y="150" font-size="13" fill="#33463f">dedupe by SHA-256</text><rect x="630" y="50" width="300" height="140" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="642" y="74" font-size="15" font-weight="700" fill="#233730">Identity routing</text><text x="642" y="96" font-size="13" fill="#33463f">MRN + date of birth from the header</text><text x="642" y="114" font-size="13" fill="#33463f">→ existing or new patient</text><text x="642" y="132" font-size="13" fill="#33463f">→ quarantine on mismatch</text><text x="642" y="150" font-size="13" fill="#33463f">withdraw / restore: append-only events</text><rect x="960" y="50" width="400" height="140" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="972" y="74" font-size="15" font-weight="700" fill="#233730">Snapshot + PostgreSQL (row-level security)</text><text x="972" y="96" font-size="13" fill="#33463f">snapshot = manifest of active revisions</text><text x="972" y="114" font-size="13" fill="#33463f">revisions · spans · snapshots · runs</text><text x="972" y="132" font-size="13" fill="#33463f">results · audit (insert-only for the app)</text><text x="972" y="150" font-size="13" fill="#33463f">new snapshot → worker queues a record build</text><line x1="270" y1="120" x2="300" y2="120" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><line x1="600" y1="120" x2="630" y2="120" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><line x1="930" y1="120" x2="960" y2="120" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="230" width="1360" height="230" rx="14" fill="none" stroke="#c9d6cd" stroke-dasharray="6 5"/><text x="36" y="252" font-size="14" font-weight="700" fill="#74827b">[2] RECORD BUILD — per snapshot · run worker (lease, outside DB transactions) · record_engine · every call deterministic</text><rect x="40" y="262" width="205" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="52" y="286" font-size="15" font-weight="700" fill="#233730">① Ingest</text><text x="52" y="308" font-size="13" fill="#33463f">code</text><text x="52" y="326" font-size="13" fill="#33463f"></text><text x="52" y="344" font-size="13" fill="#33463f">numbered lines</text><text x="52" y="362" font-size="13" fill="#33463f">citable blocks</text><line x1="245" y1="352" x2="262" y2="352" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="262" y="262" width="205" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="274" y="286" font-size="15" font-weight="700" fill="#233730">② Extract ×2</text><text x="274" y="308" font-size="13" fill="#33463f">Sonnet · temperature 0</text><text x="274" y="326" font-size="13" fill="#33463f"></text><text x="274" y="344" font-size="13" fill="#33463f">{value, quote, block}</text><text x="274" y="362" font-size="13" fill="#33463f">+ independent 2nd reading</text><text x="274" y="380" font-size="13" fill="#33463f">cached by content</text><line x1="467" y1="352" x2="484" y2="352" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="484" y="262" width="205" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="496" y="286" font-size="15" font-weight="700" fill="#233730">③ Validate + cross-check</text><text x="496" y="308" font-size="13" fill="#33463f">code</text><text x="496" y="326" font-size="13" fill="#33463f"></text><text x="496" y="344" font-size="13" fill="#33463f">value inside its quote; readings</text><text x="496" y="362" font-size="13" fill="#33463f">compared, disputes re-read</text><text x="496" y="380" font-size="13" fill="#33463f">(2 of 3) or left open</text><line x1="689" y1="352" x2="706" y2="352" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="706" y="262" width="205" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="718" y="286" font-size="15" font-weight="700" fill="#233730">④ Link</text><text x="718" y="308" font-size="13" fill="#33463f">code</text><text x="718" y="326" font-size="13" fill="#33463f"></text><text x="718" y="344" font-size="13" fill="#33463f">same ID + issuer</text><text x="718" y="362" font-size="13" fill="#33463f">candidate links</text><text x="718" y="380" font-size="13" fill="#33463f">copies · other patient</text><line x1="911" y1="352" x2="928" y2="352" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="928" y="262" width="205" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="940" y="286" font-size="15" font-weight="700" fill="#233730">⑤ Reconcile</text><text x="940" y="308" font-size="13" fill="#33463f">code + policy.toml</text><text x="940" y="326" font-size="13" fill="#33463f"></text><text x="940" y="344" font-size="13" fill="#33463f">supersede · rank</text><text x="940" y="362" font-size="13" fill="#33463f">decide status</text><text x="940" y="380" font-size="13" fill="#33463f">conflicts = scenarios</text><line x1="1133" y1="352" x2="1150" y2="352" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="1150" y="262" width="205" height="180" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="1162" y="286" font-size="15" font-weight="700" fill="#233730">Record + view</text><text x="1162" y="308" font-size="13" fill="#33463f">stored result</text><text x="1162" y="326" font-size="13" fill="#33463f"></text><text x="1162" y="344" font-size="13" fill="#33463f">facts · events · open items</text><text x="1162" y="362" font-size="13" fill="#33463f">ledger · weekly goals</text><text x="1162" y="380" font-size="13" fill="#33463f">citations → spans</text><rect x="20" y="480" width="1360" height="230" rx="14" fill="none" stroke="#c9d6cd" stroke-dasharray="6 5"/><text x="36" y="502" font-size="14" font-weight="700" fill="#74827b">[3] QUESTION — per question over a finished record</text><rect x="40" y="512" width="245" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="52" y="536" font-size="15" font-weight="700" fill="#233730">⑥ Plan</text><text x="52" y="558" font-size="13" fill="#33463f">Sonnet</text><text x="52" y="576" font-size="13" fill="#33463f"></text><text x="52" y="594" font-size="13" fill="#33463f">queries in a small</text><text x="52" y="612" font-size="13" fill="#33463f">query language,</text><text x="52" y="630" font-size="13" fill="#33463f">each with its population</text><text x="52" y="648" font-size="13" fill="#33463f">+ checklist</text><line x1="285" y1="602" x2="308" y2="602" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="308" y="512" width="245" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="320" y="536" font-size="15" font-weight="700" fill="#233730">⑦ Execute</text><text x="320" y="558" font-size="13" fill="#33463f">code</text><text x="320" y="576" font-size="13" fill="#33463f"></text><text x="320" y="594" font-size="13" fill="#33463f">scenario arithmetic</text><text x="320" y="612" font-size="13" fill="#33463f">provenance per row</text><text x="320" y="630" font-size="13" fill="#33463f">"all groups" total row</text><line x1="553" y1="602" x2="576" y2="602" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="576" y="512" width="245" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="588" y="536" font-size="15" font-weight="700" fill="#233730">⑧ Answer</text><text x="588" y="558" font-size="13" fill="#33463f">Sonnet</text><text x="588" y="576" font-size="13" fill="#33463f"></text><text x="588" y="594" font-size="13" fill="#33463f">typed statements</text><text x="588" y="612" font-size="13" fill="#33463f">citing result, fact,</text><text x="588" y="630" font-size="13" fill="#33463f">open-item IDs + lines</text><line x1="821" y1="602" x2="844" y2="602" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="844" y="512" width="245" height="180" rx="10" fill="#fff" stroke="#255e4b" stroke-width="1.5"/><text x="856" y="536" font-size="15" font-weight="700" fill="#233730">⑨ Check</text><text x="856" y="558" font-size="13" fill="#33463f">code + Haiku</text><text x="856" y="576" font-size="13" fill="#33463f"></text><text x="856" y="594" font-size="13" fill="#33463f">values, dates, goals,</text><text x="856" y="612" font-size="13" fill="#33463f">totals, absence claims;</text><text x="856" y="630" font-size="13" fill="#33463f">coverage + support</text><line x1="1089" y1="602" x2="1112" y2="602" stroke="#255e4b" stroke-width="2" marker-end="url(#a)"/><rect x="1112" y="512" width="245" height="180" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="1124" y="536" font-size="15" font-weight="700" fill="#233730">⑩ Frame + publish</text><text x="1124" y="558" font-size="13" fill="#33463f"></text><text x="1124" y="576" font-size="13" fill="#33463f"></text><text x="1124" y="594" font-size="13" fill="#33463f">lead + needed context only;</text><text x="1124" y="612" font-size="13" fill="#33463f">withheld with reasons</text><text x="1124" y="630" font-size="13" fill="#33463f">citations → spans</text><rect x="20" y="730" width="1360" height="120" rx="14" fill="none" stroke="#c9d6cd" stroke-dasharray="6 5"/><text x="36" y="752" font-size="14" font-weight="700" fill="#74827b">[4] WEB APP (Next.js, generated API types)</text><rect x="40" y="762" width="310" height="70" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="52" y="786" font-size="15" font-weight="700" fill="#233730">Source library</text><text x="52" y="808" font-size="13" fill="#33463f">exact citation highlighting</text><rect x="375" y="762" width="310" height="70" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="387" y="786" font-size="15" font-weight="700" fill="#233730">Clinical record</text><text x="387" y="808" font-size="13" fill="#33463f">ledger · goals · facts · findings</text><rect x="710" y="762" width="310" height="70" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="722" y="786" font-size="15" font-weight="700" fill="#233730">Documents</text><text x="722" y="808" font-size="13" fill="#33463f">issuer · dates · copies · set aside</text><rect x="1045" y="762" width="310" height="70" rx="10" fill="#eef3ef" stroke="#255e4b" stroke-width="1.5"/><text x="1057" y="786" font-size="15" font-weight="700" fill="#233730">Ask a question</text><text x="1057" y="808" font-size="13" fill="#33463f">cited answers · reasons</text></svg>